[package]
name = "picshot-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nephclick Picshot egui frontend (Lightroom-style UI); swappable — nothing below depends on it (L5)"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
craft-window = { workspace = true }
picshot-geom = { workspace = true }
picshot-meta = { workspace = true }
picshot-color = { workspace = true }
picshot-raster = { workspace = true }
picshot-develop = { workspace = true }
picshot-pipeline = { workspace = true }
picshot-catalog = { workspace = true }
web-time = { workspace = true }
picshot-engine = { workspace = true }
picshot-slideshow = { workspace = true }
picshot-preview = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
picshot-testkit = { workspace = true }
# The model-setup tests install and resume a real denoise model. Without this the engine's
# `default_loader` is the "this build cannot run denoise models" stub when the package is tested
# on its own (`cargo test -p picshot-ui-egui`); a workspace test only passed by feature
# unification with the desktop app's default `denoise` feature.
picshot-engine = { workspace = true, features = ["denoise"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
picshot-denoise = { workspace = true, features = ["runtime"] }
picshot-codecs = { workspace = true }
picshot-faces = { workspace = true }
picshot-merge = { workspace = true }
# a device for the GPU-resident view test (`render.rs`)
pollster = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }
ureq = { workspace = true }
