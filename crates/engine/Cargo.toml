[package]
name = "picshot-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nephclick Picshot engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
craft-plist = { workspace = true }
craft-pdf-print.workspace = true
craft-mime = { workspace = true }
# Paths stored in a Lightroom catalog are followed only to local files or the catalog's share.
craft-docpath = { workspace = true }
picshot-geom = { workspace = true }
picshot-color = { workspace = true }
picshot-raster = { workspace = true }
picshot-develop = { workspace = true }
picshot-scenes = { workspace = true }
picshot-pipeline = { workspace = true }
picshot-gpu = { workspace = true }
picshot-catalog = { workspace = true }
web-time = { workspace = true }
picshot-preview = { workspace = true }
picshot-codecs = { workspace = true }
picshot-raw = { workspace = true }
picshot-denoise-core = { workspace = true }
picshot-denoise = { workspace = true, optional = true }
picshot-meta = { workspace = true }
picshot-lensdb = { workspace = true }
picshot-faces = { workspace = true }
miniz_oxide = { workspace = true }
# CRC-32 of a catalog unpacked from a Lightroom backup zip (lightroom_backup.rs).
crc32fast = { workspace = true }
picshot-merge = { workspace = true }
picshot-geocode = { workspace = true }
picshot-slideshow = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
# Apply the font’s vertical substitutions and origins to Japanese watermarks.
harfrust = { version = "0.16", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
picshot-segment = { workspace = true, optional = true }

# model downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
picshot-fetch = { workspace = true }
# capture-time parsing for face recognition (native only)
chrono = { workspace = true }
# free space of the drive holding the preview cache (the low-disk alert; pure Rust: rustix / windows-sys)
fs4 = { workspace = true }

[features]
# AI masks with SAM 3 (Object / Describe). Off for the web and CLI builds.
sam = ["dep:picshot-segment"]
denoise = ["dep:picshot-denoise", "picshot-denoise/runtime", "picshot-gpu/denoise"]
rawnind-model = ["denoise", "picshot-denoise/rawnind-model", "picshot-denoise-core/rawnind-model"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
picshot-testkit = { workspace = true }
# HDR JPEG XL tests read the file's colour encoding
craft-jxl = { workspace = true }
# Lossless synthetic HEIC files (the import test; decoded when the codecs' `heif` feature is on).
craft-heif = { workspace = true, features = ["testdata"] }
libc = { workspace = true }
craft-tiff = { workspace = true }
