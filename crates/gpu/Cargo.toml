[package]
name = "picshot-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nephclick Picshot GPU develop pipeline: wgpu compute (WGSL) twin of the CPU pipeline, which stays the reference (L3)"

[lints]
workspace = true

[dependencies]
picshot-denoise = { workspace = true, optional = true }
picshot-geom = { workspace = true }
picshot-color = { workspace = true }
picshot-raster = { workspace = true }
picshot-develop = { workspace = true }
picshot-faces = { workspace = true }
picshot-pipeline = { workspace = true }
log = { workspace = true }

# Native only: Metal / Vulkan / DX12 through wgpu (pure Rust; the drivers are the system's).
# The browser build keeps the CPU pipeline (WebGPU needs async device creation: see docs/gpu-pipeline.md).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }

[features]
default = []
denoise = ["dep:picshot-denoise", "picshot-denoise/runtime"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
picshot-testkit = { workspace = true }
picshot-scenes = { workspace = true }
picshot-raw = { workspace = true }
